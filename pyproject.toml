[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domain-db-skills"
version = "0.1.0"
description = "Agent skill for querying databases with messy schemas using a knowledge layer"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "sqlglot>=20.0",
]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.1"]
vector = ["chromadb>=0.4"]
all = ["domain-db-skills[postgresql,vector]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/db_skill"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
